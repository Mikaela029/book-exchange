//script fica no ica no fim porque, nesse ponto, o formulário e resultados-pesquisa já foram carregados.
<script>
      //const declara uma variável cujo valor não pode ser atribuído novamente.
      const formulario = document.getElementById("form-pesquisa"); //getElementById procura o formulario e o campo de pesquisa pelos id
      const campo = document.getElementById("termo-pesquisa");
      const resultados = document.getElementById("resultados-pesquisa");

      formulario.addEventListener("submit", async function (evento) { //executa o codigo quando a pesquisa é enviada
        evento.preventDefault(); //impede o formulario de recarrregar a pag
        
        const termo = campo.value.trim().toLowerCase(); //obtem o texto pesquisadp, remove espaços nas pontas e converte-o para minusculas
        resultados.replaceChildren();

        if (!termo){
          resultados.textContent = "Pesquisar";
          return;
        }

        try{
          const[respostaUtilizadores, respostaOfertas] = await Promise.all([
            fetch("api/utilizador"),
            fetch("api/oferta")
          ]);

          if (!respostaUtilizadores.ok || !respostaOfertas.ok){
            throw new Error ("Erro ao consultar o servidor");
          }

          const dadosUtilizadores = await respostaUtilizadores.json();
          const dadosOfertas = await respostaOfertas.json();

          const utilizadores = Array.isArray(dadosUtilizadores)
          ? dadosUtilizadores
          : [dadosUtilizadores];

          const encontrados = [ // inicia a lista.
            ...utilizadores //inclui os utilizadores na pesquisa.
            .filter(item => JSON.stringify(item).toLowerCase().includes(termo)) //mantém os itens cujo conteúdo, convertido para texto minúsculo, contém o termo pesquisado.
            .map(item => ({tipo: "Utilizador", dados: item})), //transforma cada correspondência num objeto com o tipo "Utilizador" e os respetivos dados.
            ...dadosOfertas //O ... junta os resultados dos dois blocos na mesma lista. 
            .filter(item => JSON.stringify(item).toLowerCase().includes(termo))
            .map(item => ({ tipo: "Oferta/livro", dados: item }))
        ];
          if (encontrados.length ===0){
            resultados.textContent = "Não foram encontrados resultados.";
            return;
          }

          encontrados.forEach(function(item) {
            const secao = document.createElement("section");
            const titulo = document.createElement("h3");
            const detalhes = document.createElement("pre");

            titulo.textContent = item.tipo;
            detalhes.textContent = JSON.stringify(item.dados, null, 2);

            secao.append(titulo, detalhes);
            resultados.appendChild(secao);
          });
        }catch(erro){
          resultados.textContent = "Não foi possível pesquisar."
        }
        
      });
    </script>
