<html lang = "pt">

rel="stylesheet">

    <body>

<section id="ofertas">
  <h2>Ofertas</h2>
  <p id="mensagem-ofertas" role="status">A carregar ofertas...</p>
  <div id="lista-ofertas"></div>
</section>

<div class ="canto-direito"></div>

<div class="canto-direito">
  <a href="login.html" class="button">Login</a>

  <a href ="registar.html" class="button">Registar</a>
</div>

<script>
      const formulario = document.getElementById("form-pesquisa"); //Procura na página o formulário de pesquisa, que tem id="form-pesquisa", e guarda-o na constante formulario.
      const campo = document.getElementById("termo-pesquisa"); //Procura o campo onde se escreve o texto a pesquisar e guarda-o em campo.
      const listaOfertas = document.getElementById("lista-ofertas"); //Procura o elemento HTML onde as ofertas vão ser apresentadas.
      const mensagemOfertas = document.getElementById("mensagem-ofertas"); //Procura o elemento que mostra mensagens, como “A carregar ofertas...” ou “Não foram encontradas ofertas”.
      let ofertas = []; //cria lista inicialmente vazia, guardando depois as ofertas recebidas do servidor. Usa-se let porque o valor da variavel sera substituido

      function adicionarDetalhe(elemento, rotulo, valor) { //Define uma função que acrescenta um detalhe à oferta. Recebe o elemento onde vai escrever, o nome do detalhe e o respetivo valor.
        if (valor === null || valor === undefined || valor === "") { //Verifica se o valor não existe ou está vazio. Se estiver, return termina a função sem apresentar esse detalhe
          return; 
        }

        const paragrafo = document.createElement("p"); 
        const etiqueta = document.createElement("strong"); //Cria um elemento <strong>, usado para destacar o nome do detalhe.
        etiqueta.textContent = `${rotulo}: `; //Coloca no <strong> o rótulo seguido de dois pontos, por exemplo, Autor: .
        paragrafo.append(etiqueta, document.createTextNode(String(valor))); //Coloca o rótulo e o valor dentro do parágrafo. String(valor) converte o valor para texto.
        elemento.appendChild(paragrafo); //Acrescenta o parágrafo ao elemento que contém os detalhes da oferta.
      }

      function mostrarOfertas(ofertasFiltradas) { //Define a função que apresenta a lista de ofertas recebida como argumento.
        listaOfertas.replaceChildren(); //Remove os elementos anteriormente apresentados, para que a lista seja reconstruída sem duplicados.

        if (ofertasFiltradas.length === 0) {
          mensagemOfertas.textContent = ofertas.length === 0
            ? "Ainda não existem ofertas."
            : "Não foram encontradas ofertas.";
          return; //Escolhe a mensagem adequada:~
          //Se a lista total ofertas estiver vazia, ainda não existem ofertas.
          //Se existirem ofertas, mas nenhuma corresponder à pesquisa, não foram encontradas ofertas.
        }

        mensagemOfertas.textContent = "";

        ofertasFiltradas.forEach(oferta => {
          const livro = oferta.livro || {};
          const utilizador = oferta.utilizador || {};
          const detalhes = document.createElement("details");
          detalhes.className = "oferta";

          const resumo = document.createElement("summary");
          resumo.textContent =
            `${livro.titulo || "Livro sem título"} — ${oferta.localizacao || "Localização não indicada"}`;

          const informacao = document.createElement("div");
          informacao.className = "detalhes-oferta";
          adicionarDetalhe(informacao, "Autor", livro.autor);
          adicionarDetalhe(informacao, "Título", livro.nome || livro.titulo);
          adicionarDetalhe(informacao, "Edição", livro.edicao);
          adicionarDetalhe(informacao, "Tipo de capa", livro.tipoCapa);
          adicionarDetalhe(informacao, "Língua", livro.lingua);

          detalhes.append(resumo, informacao);
          listaOfertas.appendChild(detalhes);
        });
      }

      async function carregarOfertas() {
        try {
          const resposta = await fetch("api/oferta", { //o metodo fetch aceita 2 arg, um caminho e o restante codigo
                method: "GET",
                headers: { "Content-Type": "application/json" },
            });
          if (!resposta.ok) {
            throw new Error("Erro ao consultar as ofertas.");
          }

          const dados = await resposta.json();
          if (!Array.isArray(dados)) {
            throw new Error("A resposta da API não contém uma lista de ofertas.");
          }

          ofertas = dados;
          mostrarOfertas(ofertas);
        } catch (erro) {
          mensagemOfertas.textContent = "Não foi possível carregar as ofertas.";
        }
      }

      formulario.addEventListener("submit", function (evento) {
        evento.preventDefault();
        const termo = campo.value.trim().toLocaleLowerCase();
        const ofertasFiltradas = ofertas.filter(oferta => {
          const livro = oferta.livro || {};
          return `${livro.titulo || ""} ${oferta.localizacao || ""}`
            .toLocaleLowerCase()
            .includes(termo);
        });
        mostrarOfertas(ofertasFiltradas);
      });

      carregarOfertas();
    </script>
    </body>

</html>
